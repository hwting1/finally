[project]
name = "finally-backend"
version = "0.1.0"
description = "Backend services for the FinAlly trading workstation"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "httpx>=0.27.0",
    "httpx2>=0.28.0",
    "openai>=1.99.0",
    "pydantic-settings>=2.0.0",
    "rich>=13.9.0",
    "uvicorn>=0.30.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"
